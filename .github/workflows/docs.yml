name: Docs

on:
  push:
    branches: [main]
  pull_request:

# Needed by actions/deploy-pages. Read-only everywhere else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      # Sphinx runs with -W, so a broken link or an unknown role fails here.
      - run: just docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # Pull requests build the site but do not publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
