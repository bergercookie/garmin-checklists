name: Coverage

# Pull requests cover feature branches; pushes cover main.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just install
      # The fail_under gate lives in bridge/pyproject.toml, so this enforces
      # exactly the threshold a local `just test` does.
      - run: just coverage-ci
      - name: Publish the report to the run summary
        if: always()
        run: |
          {
            echo '## Backend coverage'
            echo
            echo '```'
            just coverage-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the browsable HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: bridge/htmlcov/
          retention-days: 14
